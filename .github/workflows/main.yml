name: Build WatchClues

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract source ZIP
        run: |
          unzip -o WatchClues-26.3-source-copy.zip -d project
          find project -name build.gradle -print

      - name: Build mod
        working-directory: project
        run: |
          PROJECT_DIR="$(find . -name build.gradle -printf '%h\n' | head -n 1)"
          cd "$PROJECT_DIR"
          gradle build

      - name: Upload build files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WatchClues-build
          path: project/**/build/libs/*.jar
          if-no-files-found: warn
